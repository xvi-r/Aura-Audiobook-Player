[package]
name = "audiobooks-tauri"
version = "1.0.0"
description = "Audiobooks desktop application (Tauri)"
authors = ["Audiobooks"]
edition = "2021"

[lib]
name = "audiobooks_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
