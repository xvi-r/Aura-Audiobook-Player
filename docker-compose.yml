services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audiobooks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audiobooks"]
      interval: 5s
      timeout: 5s
      retries: 5

  aura-app:
    image: xvirr/aura-app:v0.8.0
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audiobooks
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_SESSION_STORE_TYPE: jdbc
      SPRING_SESSION_JDBC_INITIALIZE_SCHEMA: always
      SERVER_SERVLET_SESSION_TIMEOUT: 180d
      SERVER_SERVLET_SESSION_COOKIE_MAX_AGE: 180d
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 5GB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 5GB
    ports:
      - "8080:8080"
    volumes:
      - ./app-data:/app/app-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
