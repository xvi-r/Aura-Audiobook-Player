services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audiobooks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audiobooks"]
      interval: 5s
      timeout: 5s
      retries: 5

  aura-app:
    image: xvirr/aura-app:v0.7.4
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audiobooks
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    volumes:
      - ./app-data:/app/app-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
